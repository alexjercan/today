name: release

on:
  push:
    tags:
      # Exactly semver, no prerelease suffix: the version guard below compares
      # the whole tag against the declared version, so a suffix could only
      # ever fail there.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The version is declared in the packaging metadata and in the package
      # itself (`today --version`). A tag that disagrees with either would
      # publish a release whose build reports another version, so stop before
      # creating it. flake.nix takes its version from the uv workspace, so it
      # declares nothing of its own to check.
      - name: Tag matches the declared version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qxF "version = \"${version}\"" pyproject.toml || {
            echo "pyproject.toml does not declare version ${version} (tag ${GITHUB_REF_NAME})" >&2
            exit 1
          }
          grep -qxF "__version__ = \"${version}\"" today/__init__.py || {
            echo "today/__init__.py does not declare version ${version} (tag ${GITHUB_REF_NAME})" >&2
            exit 1
          }

      # The release notes are the changelog section for this version, so a
      # release cannot ship without one.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The oldest section runs to EOF, so stop on the link-reference
          # block (`[0.1.0]: https://...`) as well as on the next heading.
          awk -v header="## [${version}]" '
            index($0, header) == 1 { seen = 1; next }
            seen && (/^## \[/ || /^\[/) { exit }
            seen { print }
          ' CHANGELOG.md > notes.md
          grep -q "[^[:space:]]" notes.md || {
            echo "CHANGELOG.md has no entries under ## [${version}]" >&2
            exit 1
          }

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "today $GITHUB_REF_NAME" \
            --notes-file notes.md
